name: Build

# Every push builds the plugin and runs the tests. Pushing a version tag (for example v0.1.0)
# also publishes it as a GitHub Release, with a zip and a setup .exe.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # all tags, so the build knows its version (git describe)

      # build.bat builds the VST3, the standalone app and the tests, then runs the tests.
      - name: Build and test
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Guitar-Lab-VST3
          path: build/GuitarLab_artefacts/Release/VST3/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Guitar-Lab-Standalone
          path: build/GuitarLab_artefacts/Release/Standalone/Guitar Lab.exe
          if-no-files-found: error

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $version = git describe --tags --match "v[0-9]*"
          if ($LASTEXITCODE -ne 0 -or -not $version) { $version = "v0.0.0" }
          $number = ($version.Substring(1) -split '-')[0]   # v0.1.0-2-gabc -> 0.1.0
          & $iscc /Q "/DAppVersion=$number" installer\GuitarLab.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Guitar-Lab-Installer
          path: build/installer/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item -Recurse "build/GuitarLab_artefacts/Release/VST3/Guitar Lab.vst3" release/
          Copy-Item "build/GuitarLab_artefacts/Release/Standalone/Guitar Lab.exe" release/
          Compress-Archive -Path "release/*" -DestinationPath "Guitar-Lab-$env:TAG.zip"
          $installer = Get-ChildItem build/installer/*.exe | Select-Object -First 1
          $notes = @(
            "**Easiest:** run ``$($installer.Name)``, then rescan plugins in your DAW."
            "It installs the VST3 into ``C:\Program Files\Common Files\VST3\`` and the standalone app into ``C:\Program Files\Guitar Lab\`` (Start menu: Guitar Lab)."
            ""
            "**Or by hand:** unzip ``Guitar-Lab-$env:TAG.zip``, copy the ``Guitar Lab.vst3`` folder to ``C:\Program Files\Common Files\VST3\``, then rescan plugins. ``Guitar Lab.exe`` is the standalone app and runs from anywhere."
            ""
            "Load **Guitar Lab** as an instrument. Its MIDI output uses one channel per string (MPE), so bends stay on their own string."
            "For guitar-to-MIDI tracking, give the track an audio input and run Calibrate on the Guitar -> MIDI tab."
            "Needs 64-bit Windows. The installer is not signed, so Windows SmartScreen may warn: choose More info > Run anyway."
          ) -join "`n"
          gh release create "$env:TAG" "Guitar-Lab-$env:TAG.zip" $installer.FullName --title "Guitar Lab $env:TAG" --notes "$notes"
